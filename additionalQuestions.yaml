    teammate''s pull request: I review every change, run the tests and check edge
    cases. Where they have burned me is confident but wrong code, such as calling
    APIs that don''t exist, quietly changing behavior during a refactor, or missing
    project conventions, so I keep tasks small, give them clear context and never
    merge anything I haven''t verified.'
